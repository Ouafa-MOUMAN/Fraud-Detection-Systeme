spring.application.name=fraudwatch-backend
server.port=8081
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/fraudwatch}
spring.data.mongodb.database=fraudwatch
spring.security.user.name=admin
spring.security.user.password=${SECURITY_PASSWORD:changeme}
logging.level.com.fraudwatch=INFO
app.demo-mode.enabled=true
app.pagination.max-size=100
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
